<div class="main_container">
    <div class="chat-module" [class.open]="isChatOpen">
        <div class="chat-header">
            <img src="assets/images/hero1.png" alt="Profile" class="profile-img" />
            <span class="chat-title">Chat with AI-Bot</span>
            <button type="button" class="close-btn" (click)="modelClose()" aria-label="Close chatbot">&times;</button>
        </div>
        <div class="messages">
            <span class="bot-description">Ask a question to start the chat. Messages are sent to the chatbot service, so please do not include sensitive information.</span>
            <span class="bot-description">This optional chatbot answers portfolio-related questions.</span>

            <div *ngFor="let message of messages"
                [ngClass]="{ 'user-message': message.sender === 'user', 'bot-message': message.sender === 'bot' }">
                <div class="message-content">
                    <p *ngIf="message.sender === 'user'">{{ message.text }}</p>
                    <p *ngIf="message.sender === 'bot'" [innerHTML]="message.text"></p>
                </div>
            </div>

            <div *ngIf="isTyping" class="bot-message typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="input-container">
            <button type="button" class="icon-control" (click)="toggleVoice()"
                [attr.aria-label]="isVoiceEnabled ? 'Mute chatbot voice' : 'Enable chatbot voice'"
                [attr.aria-pressed]="isVoiceEnabled">
                <img [src]="isVoiceEnabled ? 'assets/images/ai-bots/speaker.svg' : 'assets/images/ai-bots/speaker-off.svg'"
                    alt="" class="control-button" />
            </button>

            <div class="vertical-line"></div>

            <input type="text" [(ngModel)]="userInput" placeholder="Ask me something..."
                class="chat-input" aria-label="Your chatbot message" maxlength="500"
                [disabled]="isTyping" (keydown.enter)="sendMessage()" />

            <button type="button" class="icon-control" (click)="toggleVoiceInput()"
                [disabled]="!recognition"
                [attr.aria-label]="isListening ? 'Stop voice input' : 'Start voice input'">
                <img [src]="isListening ? 'assets/images/ai-bots/mic.svg' : 'assets/images/ai-bots/mic-off.svg'"
                    alt="" class="control-button mic-button" />
            </button>

            <button type="button" class="icon-control" (click)="sendMessage()"
                [disabled]="isTyping || !userInput.trim()" aria-label="Send chatbot message">
                <img src="assets/images/ai-bots/send.svg" class="control-button send-button" alt="" />
            </button>
        </div>


    </div>
</div>
